<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이보람 작품집</title>
<meta name="description" content="이보람의 캐릭터챗 작품집">
<base href="https://so778863.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Do+Hyeon&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 주크박스: 위 유리 돔에서 판이 돌고, 아래 번호 띠(장르=알파벳 줄)에서 작품을 고른다 */
  :root {
    --bg: #140e1a;
    --cab: #2a1c30;
    --chrome: #d6dbe0;
    --amber: #ffb547;
    --cherry: #e8455a;
    --blue: #3d6fb5;
    --strip: #f4efe4;
    --ink: #1b1420;
    --muted: #b9a9c4;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--chrome); font-family: "Noto Sans KR", sans-serif; }
  main { padding: 40px 16px 56px; }

  .cabinet {
    max-width: 760px; margin: 0 auto; background: linear-gradient(180deg, #3a2541, var(--cab) 40%);
    border: 6px solid var(--chrome); border-radius: 380px 380px 24px 24px / 300px 300px 24px 24px;
    padding: 40px clamp(14px, 4vw, 40px) 30px;
    box-shadow: 0 0 0 2px #7d6a88, 0 0 60px rgba(232,69,90,.25), 0 30px 60px rgba(0,0,0,.6);
  }
  h1 { text-align: center; margin: 6px 0 0; font-family: "Monoton", "Do Hyeon", sans-serif; font-weight: 400; font-size: clamp(30px, 7vw, 54px); color: var(--amber); text-shadow: 0 0 6px var(--amber), 0 0 22px rgba(255,181,71,.6); }
  .sub { text-align: center; margin: 4px 0 22px; color: var(--muted); font-size: 14px; }

  /* 유리 돔 */
  .dome { background: radial-gradient(ellipse at 50% 30%, #3b2a46, #160f1c 75%); border: 2px solid #7d6a88; border-radius: 200px 200px 14px 14px; padding: 26px 18px 20px; display: grid; gap: 10px; justify-items: center; }
  .readout { font-family: "Share Tech Mono", monospace; color: var(--cherry); background: #0b070e; border: 1px solid #4b3a55; padding: 6px 14px; border-radius: 4px; letter-spacing: .12em; font-size: 15px; text-shadow: 0 0 8px rgba(232,69,90,.7); }
  .dome h2 { margin: 0; font-family: "Do Hyeon", sans-serif; font-weight: 400; font-size: 28px; color: #fff; text-align: center; }
  .dome .tag { margin: -6px 0 0; font-size: 13px; color: var(--muted); }
  .dome .intro { margin: 0; color: var(--muted); text-align: center; line-height: 1.6; max-width: 34ch; }
  .play { margin-top: 6px; background: var(--cherry); color: #fff; text-decoration: none; font-family: "Do Hyeon", sans-serif; font-size: 18px; padding: 10px 22px; border-radius: 99px; box-shadow: 0 0 16px rgba(232,69,90,.5); }
  .play:hover { background: #f05a6d; }

  /* 레코드(재킷 + 판) */
  .player { position: relative; width: min(100%, 230px); aspect-ratio: 1; }
  .disc { position: absolute; inset: 4%; border-radius: 50%; background: repeating-radial-gradient(circle, #101010 0 2px, #1e1e1e 2px 3px); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.6); transition: transform .7s cubic-bezier(.2,.7,.2,1); }
  .label { width: 38%; aspect-ratio: 1; border-radius: 50%; background-size: cover; background-position: center; animation: spin 5s linear infinite; }
  .sleeve { position: absolute; inset: 0 24% 0 0; background-size: cover; background-position: center; border-radius: 2px; box-shadow: 4px 6px 16px rgba(0,0,0,.55); transition: opacity .3s; }
  .player.out .disc { transform: translateX(24%); }
  .player.swap .sleeve { opacity: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 번호 띠 */
  .rack { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
  .rack h3 { margin: 0 0 8px; font-family: "Share Tech Mono", monospace; font-weight: 400; font-size: 13px; letter-spacing: .14em; color: var(--amber); }
  .strips { display: grid; gap: 6px; }
  .strip {
    display: grid; grid-template-columns: 38px minmax(0, 1fr); align-items: center; gap: 10px; width: 100%;
    background: var(--strip); color: var(--ink); border: 0; border-top: 4px solid var(--cherry); border-bottom: 4px solid var(--blue);
    padding: 6px 10px; text-align: left; cursor: pointer; border-radius: 2px; font: inherit; transition: transform .15s, box-shadow .15s;
  }
  .strip:hover { transform: translateX(3px); }
  .strip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--amber), 0 0 18px rgba(255,181,71,.55); }
  .strip .code { font-family: "Share Tech Mono", monospace; font-size: 15px; color: var(--cherry); }
  .strip b { display: block; font-family: "Do Hyeon", sans-serif; font-weight: 400; font-size: 18px; line-height: 1.2; }
  .strip small { display: block; font-size: 12px; color: #6b5d72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip:focus-visible, .play:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .label { animation: none; }
    .disc, .sleeve, .strip { transition: none; }
  }
</style>
</head>
<body>

<main>
  <div class="cabinet">
    <h1>Boram Jukebox</h1>
    <p class="sub">이보람 작품집 · 번호를 골라 틀어 보세요</p>
    <div class="dome" aria-live="polite">
      <div class="player" id="player"><div class="disc"><div class="label" id="label"></div></div><div class="sleeve" id="sleeve"></div></div>
      <span class="readout" id="readout"></span>
      <h2 id="title"></h2>
      <p class="tag" id="tag"></p>
      <p class="intro" id="intro"></p>
      <a class="play" id="play" target="_blank" rel="noopener">▶ 로판AI에서 재생</a>
    </div>
    <div class="rack" id="rack"></div>
  </div>
</main>

<script>
  // 작품 추가는 여기 한 곳에서. tag가 장르이고, 처음 나온 장르 순서대로 A·B·C 줄이 생김
  const works = [
    { title: "행복 아파트", folder: "apt", tag: "공포 시뮬레이션",
      intro: "🔴[LIVE 중] 야, 왔냐?ㅋㅋㅋ 빨리 들어가봐",
      link: "https://rofan.ai/character/656758d6-36c0-4148-aa31-dc5745143488" },
    { title: "그거", folder: "that", tag: "공포 시뮬레이션",
      intro: "익명 미스터리 게시판 '그거'",
      link: "https://rofan.ai/character/33649885-7ec5-4e28-93cd-05bd4bfdd41b" },
    { title: "익명의 러브레터", folder: "letter", tag: "공포 시뮬레이션",
      intro: "당신이 무엇을 적든 상대는 보고 있어요.",
      link: "https://rofan.ai/character/9e6ab907-dea9-4906-a613-601f3509cfb6" },
    { title: "귀신 거래", folder: "ghostdeal", tag: "공포 시뮬레이션",
      intro: "'鬼神去來' 저주와 소원을 구매하는 사이트",
      link: "https://rofan.ai/character/6c25e050-2cde-4b17-a068-2cda865e2b59",
      ext: { label: "png" } },
    { title: "444kHz", folder: "kHz", tag: "공포 시뮬레이션",
      intro: "뒤틀린 주파수를 전송 중..",
      link: "https://rofan.ai/character/e16a6948-ee2d-4c3e-b918-0696a0b7f525",
      ext: { jacket: "png", label: "png" } }
  ];

  // 확장자가 jpg가 아니면 작품에 ext: { jacket: "png" } 식으로 적기
  const img = (w, kind) => `${w.folder}/${w.folder}-${kind}.${(w.ext && w.ext[kind]) || "jpg"}`;
  const $ = id => document.getElementById(id);
  const genres = [...new Set(works.map(w => w.tag))];
  const code = i => {
    const w = works[i];
    const n = works.filter(x => x.tag === w.tag).indexOf(w) + 1;
    return String.fromCharCode(65 + genres.indexOf(w.tag)) + n;
  };

  // 장르별 번호 띠
  const strips = [];
  genres.forEach((g, gi) => {
    const col = document.createElement("div");
    col.innerHTML = `<h3></h3><div class="strips"></div>`;
    col.querySelector("h3").textContent = `${String.fromCharCode(65 + gi)} — ${g}`;
    works.forEach((w, i) => {
      if (w.tag !== g) return;
      const b = document.createElement("button");
      b.className = "strip";
      b.innerHTML = `<span class="code"></span><span><b></b><small></small></span>`;
      b.querySelector(".code").textContent = code(i);
      b.querySelector("b").textContent = w.title;
      b.querySelector("small").textContent = w.intro;
      b.addEventListener("click", () => {
        select(i, true);
        if (innerWidth <= 720) document.querySelector(".dome").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      strips[i] = b;
      col.querySelector(".strips").appendChild(b);
    });
    $("rack").appendChild(col);
  });

  // 돔에 판 걸기: 재킷이 사라졌다가 새 판이 빠져나옴
  let timer = null;
  function select(i, animate) {
    const w = works[i];
    $("readout").textContent = `SELECTION ${code(i)}`;
    $("title").textContent = w.title;
    $("tag").textContent = w.tag;
    $("intro").textContent = w.intro;
    $("play").href = w.link;
    strips.forEach((b, k) => b.setAttribute("aria-pressed", k === i));

    const p = $("player");
    const apply = () => {
      $("sleeve").style.backgroundImage = `url('${img(w, "jacket")}')`;
      $("label").style.backgroundImage = `url('${img(w, "label")}')`;
    };
    clearTimeout(timer);
    if (!animate) { apply(); p.classList.add("out"); return; }
    p.classList.remove("out"); p.classList.add("swap");
    timer = setTimeout(() => {
      apply(); p.classList.remove("swap");
      timer = setTimeout(() => p.classList.add("out"), 250);
    }, 330);
  }

  select(works.length - 1, false);   // 처음엔 가장 최근 작품이 걸려 있음
</script>
</body>
</html>
